name: User Blocked in Expected Gitlab group
description: |
    The GitLab group is obtained from the Expected GitLab database, The Git
    group is obtained from the Input GitLab database, When the tool is
    executed using the fake-gitlab package, The Output GitLab database shall
    be generated and the Output GitLab database shall be synchronized with
    the Expected GitLab database. If the user is blocked in the Expected
    GitLab and is present in the corresponding Input group, do not add the
    user to the Expected GitLab group. Skip the user and continue processing
    the remaining users.