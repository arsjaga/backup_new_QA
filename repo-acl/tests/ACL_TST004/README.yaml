name: Remove user from Expected GitLab project and group when ACL access level is no-access
description: |
    The GitLab group is obtained from the Expected GitLab database. The Git
    group is obtained from the Input GitLab database. When the tool is
    executed using the fake-gitlab package, the Output GitLab database shall
    be generated and the Output GitLab database shall be synchronized with
    the Expected GitLab database.If a user defined in the ACL has an access
    level of no-access and is present in the Expected GitLab project or group,
    the tool shall remove the user from the Expected GitLab project or group.
